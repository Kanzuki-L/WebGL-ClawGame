<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Enhertu Claw Game</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: black;
        height: 100%;
        overflow: hidden;
      }

      #unity-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }

      #unity-canvas {
        width: 100vw;
        height: 100vh;
        touch-action: none;
        display: block;
      }

      #orientation-lock {
        display: none;
        position: fixed;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        color: white;
        font-size: 1.2rem;
        text-align: center;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      #orientation-lock img {
        width: 100px;
        margin-bottom: 20px;
      }

      #unity-warning {
        color: white;
        padding: 10px;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- Orientation Notice -->
    <div id="orientation-lock">
      <p>Please rotate your device to <strong>landscape</strong> to play the game.</p>
    </div>

    <!-- Unity Game Container -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      // Register service worker
      window.addEventListener("load", () => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      const canvas = document.getElementById("unity-canvas");
      const loadingBar = document.getElementById("unity-loading-bar");
      const progressBarFull = document.getElementById("unity-progress-bar-full");
      const warningBanner = document.getElementById("unity-warning");
      const orientationLock = document.getElementById("orientation-lock");
      const unityContainer = document.getElementById("unity-container");

      // Display banner
      function unityShowBanner(message, type) {
        const div = document.createElement("div");
        div.innerHTML = message;
        div.style.padding = "10px";
        div.style.background = type === "error" ? "red" : "yellow";

        warningBanner.appendChild(div);
        updateBannerVisibility();

        if (type === "warning") {
          setTimeout(() => {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
      }

      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length > 0 ? "block" : "none";
      }

      // Resize canvas to always match screen
      function resizeCanvasToDisplaySize(canvas) {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }

      // Enforce landscape mode
      function checkOrientation() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const isPortrait = window.innerHeight > window.innerWidth;

        if (isMobile && isPortrait) {
          orientationLock.style.display = "flex";
          unityContainer.style.display = "none";
        } else {
          orientationLock.style.display = "none";
          unityContainer.style.display = "flex";
          resizeCanvasToDisplaySize(canvas);
        }
      }

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);
      checkOrientation();

      // Unity config
      const buildUrl = "Build";
      const loaderUrl = `${buildUrl}/27aac4b7268aa67c02a682485fe6687b.loader.js`;
      const config = {
        dataUrl: `${buildUrl}/3c63c428da688a68b6751fe7f432fe55.data.unityweb`,
        frameworkUrl: `${buildUrl}/566c0a5e1c01cfabdcc455557cec079e.framework.js.unityweb`,
        codeUrl: `${buildUrl}/d6cf577afdcd264312e3471803bd33fc.wasm.unityweb`,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Evoweb",
        productName: "Enhertu Claw Game",
        productVersion: "0.1.3",
        showBanner: unityShowBanner,
        arguments: []
      };

      loadingBar.style.display = "block";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = `${progress * 100}%`;
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          resizeCanvasToDisplaySize(canvas);
        }).catch((error) => {
          alert(error);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
