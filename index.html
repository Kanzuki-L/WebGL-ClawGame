<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Enhertu Claw Game</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000; /* default black background */
    }

    #unity-container {
      position: relative;
      z-index: 1;
    }

    #orientation-lock {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      color: white;
      font-size: 18px;
      text-align: center;
      justify-content: center;
      align-items: center;
      padding: 20px;
      flex-direction: column;
    }

    #orientation-lock.visible {
      display: flex;
    }

    #orientation-lock img {
      width: 100px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <!-- Orientation Lock Overlay -->
  <div id="orientation-lock">
    <p>Please rotate your device to <strong>landscape</strong> mode.</p>
  </div>

  <script>
    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js");
      }
    });

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type === 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/214ba514b26c0dcd4def39a85829c4fb.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/ca93fb27fea83650ee11a26a9d01b43a.data.unityweb",
      frameworkUrl: buildUrl + "/566c0a5e1c01cfabdcc455557cec079e.framework.js.unityweb",
      codeUrl: buildUrl + "/450e2dec8a47dac0550e618b8f26eef1.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Evoweb",
      productName: "Enhertu Claw Game",
      productVersion: "1.0.0",
      showBanner: unityShowBanner,
    };

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);

    // Orientation Handling
    const orientationLock = document.getElementById("orientation-lock");

    function checkOrientation() {
      const isPortrait = window.innerHeight > window.innerWidth;
      orientationLock.classList.toggle("visible", isPortrait);
    }

    window.addEventListener("resize", checkOrientation);
    window.addEventListener("orientationchange", checkOrientation);
    checkOrientation();
  </script>
</body>
</html>
