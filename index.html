<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Enhertu Claw Game</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
    }

    #unity-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
    }

    #unity-canvas {
      width: 100vw;
      height: 100vh;
      touch-action: none;
      display: block;
    }

    #orientation-lock {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      color: white;
      font-size: 20px;
      text-align: center;
      justify-content: center;
      align-items: center;
      padding: 20px;
      flex-direction: column;
    }

    #orientation-lock img {
      width: 100px;
      margin-bottom: 20px;
    }

    #unity-warning {
      color: white;
      font-size: 14px;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Orientation Message -->
  <div id="orientation-lock">
    Please rotate your device to <strong>landscape</strong> to play the game.
  </div>

  <!-- Unity Container -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    window.addEventListener("load", () => {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js");
      }
    });

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");
    const orientationLock = document.querySelector("#orientation-lock");

    function unityShowBanner(msg, type) {
      const div = document.createElement("div");
      div.innerHTML = msg;
      div.style = `padding: 10px; background: ${type === "error" ? "red" : "yellow"}`;
      warningBanner.appendChild(div);

      if (type !== "error") {
        setTimeout(() => {
          warningBanner.removeChild(div);
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }, 5000);
      }

      warningBanner.style.display = warningBanner.children.length ? "block" : "none";
    }

    function checkOrientation() {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const isPortrait = window.innerHeight > window.innerWidth;

      if (isMobile && isPortrait) {
        orientationLock.style.display = "flex";
        container.style.display = "none";
      } else {
        orientationLock.style.display = "none";
        container.style.display = "flex";
        resizeCanvasToDisplaySize(canvas);
      }
    }

    function resizeCanvasToDisplaySize(canvas) {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    window.addEventListener("resize", checkOrientation);
    window.addEventListener("orientationchange", checkOrientation);
    checkOrientation();

    // Unity WebGL config
    const buildUrl = "Build";
    const loaderUrl = `${buildUrl}/27aac4b7268aa67c02a682485fe6687b.loader.js`;
    const config = {
      arguments: [],
      dataUrl: `${buildUrl}/ddcdd10688b8c3a71e8e5340f9085092.data.unityweb`,
      frameworkUrl: `${buildUrl}/566c0a5e1c01cfabdcc455557cec079e.framework.js.unityweb`,
      codeUrl: `${buildUrl}/d6cf577afdcd264312e3471803bd33fc.wasm.unityweb`,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Evoweb",
      productName: "Enhertu Claw Game",
      productVersion: "1.0.0",
      showBanner: unityShowBanner,
    };

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = `${progress * 100}%`;
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
        resizeCanvasToDisplaySize(canvas);
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
