<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Enhertu Claw Game</title>

  <!-- Icons and Styles -->
  <link rel="shortcut icon" href="TemplateData/favicon.ico" />
  <link rel="stylesheet" href="TemplateData/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Viewport and Device Scaling -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
    }

    #unity-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    #orientation-lock {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      color: white;
      font-size: 20px;
      text-align: center;
      justify-content: center;
      align-items: center;
      padding: 20px;
      flex-direction: column;
    }

    #orientation-lock img {
      width: 100px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <!-- Orientation Warning -->
  <div id="orientation-lock">
    Please rotate your device to <strong>landscape</strong> to play the game.
  </div>

  <!-- Unity Game Container -->
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <!-- Loading Bar -->
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <!-- Warning Messages -->
    <div id="unity-warning"></div>
  </div>

  <script>
    // Register service worker for offline support
    window.addEventListener("load", () => {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js");
      }
    });

    // DOM Elements
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");
    const orientationLock = document.querySelector("#orientation-lock");

    // Show banner (e.g., warning, error)
    function unityShowBanner(message, type) {
      const div = document.createElement("div");
      div.innerHTML = message;
      div.style = `padding: 10px; background: ${type === "error" ? "red" : "yellow"}`;
      warningBanner.appendChild(div);

      if (type !== "error") {
        setTimeout(() => {
          warningBanner.removeChild(div);
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }, 5000);
      }

      warningBanner.style.display = warningBanner.children.length ? "block" : "none";
    }

    // Orientation check for mobile devices
    function checkOrientation() {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const isPortrait = window.innerHeight > window.innerWidth;

      if (isMobile && isPortrait) {
        orientationLock.style.display = "flex";
        container.style.display = "none";
      } else {
        orientationLock.style.display = "none";
        container.style.display = "flex";
      }
    }

    window.addEventListener("resize", checkOrientation);
    window.addEventListener("orientationchange", checkOrientation);
    checkOrientation(); // Initial check

    // Unity build configuration
    const buildUrl = "Build";
    const loaderUrl = `${buildUrl}/905787f7871197e4be48742a24719621.loader.js`;
    const config = {
      arguments: [],
      dataUrl: `${buildUrl}/cd7eac847b0317da3c1f2b52b2433ce2.data.unityweb`,
      frameworkUrl: `${buildUrl}/aa7ae2ead50673ee85501f682ab00562.framework.js.unityweb`,
      codeUrl: `${buildUrl}/c0850bb5809356f75c331d7d62655119.wasm.unityweb`,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Evoweb",
      productName: "Enhertu Claw Game",
      productVersion: "0.1.1",
      showBanner: unityShowBanner,
    };

    // Start loading Unity
    loadingBar.style.display = "block";
    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
      }).catch((error) => {
        alert(error);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
